[project]
name = "sigab"
version = "0.1.0"
description = "Base do Sistema Integrado de Gestão de Acervo Bélico"
requires-python = ">=3.12"
dependencies = ["Django==5.2.18", "psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = [
  "coverage[toml]>=7.6,<8",
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".claude", "sigab/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ"]
ignore = ["DJ001", "DJ008", "DJ012"]

[tool.coverage.run]
source = ["sigab"]
omit = ["*/migrations/*", "*/tests/*"]

