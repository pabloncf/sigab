<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGAB</title>
<style>body{font:16px system-ui;margin:0;background:#f5f6f8;color:#18202a}header,main{max-width:960px;margin:auto;padding:1rem}header{display:flex;justify-content:space-between;background:#172b3a;color:white}a{color:#075985}table{width:100%;border-collapse:collapse;background:white}th,td{padding:.7rem;text-align:left;border-bottom:1px solid #ddd}.card{background:white;padding:1rem;border-radius:8px;margin:1rem 0}.danger{color:#9f1239}.success{color:#166534}button{padding:.65rem 1rem;font-weight:600}input,select{padding:.55rem;max-width:100%}</style></head>
<body><header><strong>SIGAB</strong>{% if user.is_authenticated %}<span>{{ user.username }} · <form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button>Sair</button></form></span>{% endif %}</header><main>
{% for message in messages %}<p class="{{ message.tags }}">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
